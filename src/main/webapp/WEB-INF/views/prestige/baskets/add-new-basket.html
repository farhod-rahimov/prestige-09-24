<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая корзина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
        td {
            text-align: left;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50; /* Зеленый цвет для кнопки "Сохранить" */
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049; /* Более темный зеленый при наведении */
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        .private-info {
            background-color: #a8ada8;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
        .client-table {
            width: 50%;
        }
    </style>
</head>
<body>

<h2>Новая корзина</h2>

<form th:method="POST" th:action="@{/prestige/baskets}" th:object="${basket}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <h3>Клиент</h3>

    <table class="client-table">
        <thead>
        <tr>
            <th>Имя клиента</th>
            <th>Телефон</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <div th:if="${step.value == 'CLIENT_NAME_SELECTION'}">
                <td>
                    <select type="text" th:field="*{client.name}" required>
                        <option th:each="clientName : ${allClientNames}" th:value="${clientName}" th:text="${clientName}">Выберите имя клиента</option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected>...</option>
                    </select>
                </td>
            </div>
            <div th:unless="${step.value == 'CLIENT_NAME_SELECTION'}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="${basket.getClient().getName()}"></option>
                    </select>
                </td>

                    <div th:if="${step.value == 'CLIENT_PHONE_NUMBER_SELECTION'}">
                        <td>
                            <select type="text" th:field="*{client.phoneNumber}" required>
                                <option th:each="phoneNumber : ${allPhoneNumbers}" th:value="${phoneNumber}" th:text="${phoneNumber}">Выберите номер телефона</option>
                            </select>
                        </td>
                    </div>
                    <div th:unless="${step.value == 'CLIENT_PHONE_NUMBER_SELECTION'}">
                        <td>
                            <select required>
                                <option value="constant" selected th:text="${basket.getClient().getPhoneNumber()}"></option>
                            </select>
                        </td>
                    </div>
            </div>
        </tr>
        </tbody>
    </table>

    <h3>Товары в корзине</h3>

    <table>
        <thead>
            <tr>
                <th>Название товара</th>
                <th>Модель машины</th>
                <th>Модель мотора</th>
                <th>Артикул, OEM</th>
                <th>Артикул, КРОСС</th>
                <th>БРЕНД</th>
                <th>Количество</th>
                <th>Цена, СМН</th>
                <th>Сумма, СМН</th>
                <th class="private-info">Остаток до реализации</th>
                <th class="private-info">(INNER * magicValue * exchangeRate, SMN)</th>
                <th class="private-info">(INNER RECOMMENDED, SMN)</th>
                <th class="private-info">(INNER)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <div th:if="${#lists.isEmpty(basket.salesList)}">
                    <td th:each="i : ${#numbers.sequence(1, 13)}">...</td>
                </div>
                <div th:unless="${#lists.isEmpty(basket.salesList)}" th:with="lastIndex=${basket.salesList.size() - 1}">
                    <div th:if="${step.value == 'PRODUCT_NAME_SELECTION'}">
                        <td>
                            <select type="text" th:field="*{salesList[__${lastIndex}__].product.productName.id}" required>
                                <option th:each="productName : ${allProductNames}" th:value="${productName.id}" th:text="${productName.productName}">
                                    Выберите название товара
                                </option>
                            </select>
                        </td>
                        <td th:each="i : ${#numbers.sequence(1, 12)}">...</td>
                    </div>
                    <div th:unless="${step.value == 'PRODUCT_NAME_SELECTION'}">
                        <td>
                            <select required>
                                <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                            </select>
                        </td>

                        <div th:if="${step.value == 'PRODUCT_CAR_MODEL_SELECTION'}">
                            <td>
                                <select type="text" th:field="*{salesList[__${lastIndex}__].product.carModel}" required>
                                    <option th:each="carModel : ${allCarModels}" th:value="${carModel}" th:text="${carModel}">
                                        Выберите модель машины
                                    </option>
                                </select>
                            </td>
                            <td th:each="i : ${#numbers.sequence(1, 11)}">...</td>
                        </div>
                        <div th:unless="${step.value == 'PRODUCT_CAR_MODEL_SELECTION'}">
                            <td>
                                <select required>
                                    <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.carModel}"></option>
                                </select>
                            </td>

                            <div th:if="${step.value == 'PRODUCT_ENGINE_MODEL_SELECTION'}">
                                <td>
                                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.engineModel}" required>
                                        <option th:each="engineModel : ${allEngineModels}" th:value="${engineModel}" th:text="${engineModel}">
                                            Выберите модель мотора
                                        </option>
                                    </select>
                                </td>
                                <td th:each="i : ${#numbers.sequence(1, 10)}">...</td>
                            </div>
                            <div th:unless="${step.value == 'PRODUCT_ENGINE_MODEL_SELECTION'}">
                                <td>
                                    <select required>
                                        <option th:if="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="(пусто)"></option>
                                        <option th:unless="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.engineModel}"></option>
                                    </select>
                                </td>

                                <div th:if="${step.value == 'PRODUCT_OEM_ARTICLE_NUMBER_SELECTION'}">
                                    <td>
                                        <select type="text" th:field="*{salesList[__${lastIndex}__].product.oemArticleNumber}" required>
                                            <option th:each="oemArticleNumber : ${allOemArticleNumbers}" th:value="${oemArticleNumber}" th:text="${oemArticleNumber}">
                                                Выберите OEM артикул
                                            </option>
                                        </select>
                                    </td>
                                    <td th:each="i : ${#numbers.sequence(1, 9)}">...</td>
                                </div>
                                <div th:unless="${step.value == 'PRODUCT_OEM_ARTICLE_NUMBER_SELECTION'}">
                                    <td>
                                        <select required>
                                            <option th:if="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                                            <option th:unless="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.oemArticleNumber}"></option>
                                        </select>
                                    </td>

                                    <div th:if="${step.value == 'PRODUCT_CROSS_ARTICLE_NUMBER_SELECTION'}">
                                        <td>
                                            <select type="text" th:field="*{salesList[__${lastIndex}__].product.crossArticleNumber}" required>
                                                <option th:each="crossArticleNumber : ${allCrossArticleNumbers}" th:value="${crossArticleNumber}" th:text="${crossArticleNumber}">
                                                    Выберите КРОСС артикул
                                                </option>
                                            </select>
                                        </td>
                                        <td th:each="i : ${#numbers.sequence(1, 8)}">...</td>
                                    </div>
                                    <div th:unless="${step.value == 'PRODUCT_CROSS_ARTICLE_NUMBER_SELECTION'}">
                                        <td>
                                            <select required>
                                                <option th:if="*{salesList[__${lastIndex}__].product.crossArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                                                <option th:unless="*{salesList[__${lastIndex}__].product.crossArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.crossArticleNumber}"></option>
                                            </select>
                                        </td>

                                        <div th:if="${step.value == 'PRODUCT_BRAND_SELECTION'}">
                                            <td>
                                                <select type="text" th:field="*{salesList[__${lastIndex}__].product.brand.id}" required>
                                                    <option th:each="brand : ${allBrands}" th:value="${brand.id}" th:text="${brand.brandName}">
                                                        Выберите бренд
                                                    </option>
                                                </select>
                                            </td>
                                            <td th:each="i : ${#numbers.sequence(1, 7)}">...</td>
                                        </div>
                                        <div th:unless="${step.value == 'PRODUCT_BRAND_SELECTION'}">
                                            <td>
                                                <select required>
                                                    <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.brand.brandName}"></option>
                                                </select>
                                            </td>

                                            <div th:if="${step.value == 'PRODUCT_QUANTITY_AND_PRICE_SELECTION'}">
                                                <td>
                                                    <input type="number" step="1" id="quantity" th:field="*{salesList[__${lastIndex}__].quantity}" required>
                                                </td>
                                                <td>
                                                    <input type="number" step="any" id="price" th:field="*{salesList[__${lastIndex}__].soldPrice}" required>
                                                </td>
                                                <td>
                                                    <input th:if="${basket.salesList[lastIndex].quantity == null}" type="text" th:value="0" readonly>
                                                    <input th:unless="${basket.salesList[lastIndex].quantity == null}" type="text"
                                                           th:value="${basket.salesList[lastIndex].quantity * basket.salesList[lastIndex].soldPrice}" readonly>
                                                </td>
                                                </td>
                                                <td>
                                                    <input type="text" th:value="*{salesList[__${lastIndex}__].stockBeforeSale}" readonly>
                                                </td>
                                                <td>
                                                    <input type="text" th:value="*{salesList[__${lastIndex}__].calculatedPrice}" readonly>
                                                </td>
                                                <td>
                                                    <input type="text" th:value="*{salesList[__${lastIndex}__].recommendedPrice}" readonly>
                                                </td>
                                                <td>
                                                    <input type="text" th:value="*{salesList[__${lastIndex}__].wholesalePrice}" readonly>
                                                </td>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </tr>
        </tbody>
    </table>

    <button type="submit" name="method" value="post">Далее</button>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая корзина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        select, input[type="text"], input[type="tel"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"], button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover, button[type="submit"]:hover {
            background-color: #45a049;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Добавление новой корзины</h2>

<form th:method="POST" th:action="@{/prestige/productListManagement/addNewPrestigeBasket}" th:object="${newPrestigeSaleUnit}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <!-- Поле для выбора клиента -->
    <label for="clientId">Клиент:</label>
    <select th:if="${newPrestigeSaleUnit.basket.client != null and newPrestigeSaleUnit.basket.client.name != null}" required>
        <option value="constant" selected th:text="${newPrestigeSaleUnit.basket.client.name}"></option>
    </select>
    <select th:unless="${newPrestigeSaleUnit.basket.client != null and newPrestigeSaleUnit.basket.client.name != null}" th:field="*{basket.client.id}" id="clientId" required>
        <option th:each="client : ${allClients}" th:value="${client.id}" th:text="${client.name}">
            Выберите покупателя
        </option>
    </select>
    <br/>

    <!-- Таблица для выбора продуктов и редактирования корзины -->
    <table>
        <thead>
        <tr>
            <th>Имя продукта</th>
            <th>Модель машины</th>
            <th>Артикул</th>
            <th>Бренд</th>
            <th>Кол-во</th>
            <th>Цена</th>
            <th>Сумма</th>
            <th>Остаток после вычета товаров в корзине</th>
            <th>(INNER SMN)</th>
            <th>(INNER)</th>
            <th>Комментарий</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="saleUnit : ${newPrestigeSaleUnitList}">
            <td><a th:text="${saleUnit.getRetailProduct().getProduct().getProductName().getProductName()}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getProduct().getCarModel()}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getProduct().getArticleNumber()}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getProduct().getBrand().getBrandName()}"></a></td>
            <td><a th:text="${saleUnit.getQuantity()}"></a></td>
            <td><a th:text="${saleUnit.getSoldPriceSmn() + ' смн'}"></a></td>
            <td><a th:text="${saleUnit.getTotalSumSmn() + ' смн'}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getStockBalance()}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getConvertedPriceToSmn(magicValue, exchangeRate)}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getPriceDollar()}"></a></td>
            <td><a th:text="${saleUnit.getRetailProduct().getProduct().getNotes()}"></a></td>
        </tr>

        <tr th:if="${shouldCreateNewPrestigeSaleUnit == null or shouldCreateNewPrestigeSaleUnit == false}">
            <!-- Выбор имени продукта -->
            <td th:if="${newPrestigeSaleUnit.basket.client.id != null}">
                <select th:if="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}" required>
                    <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.productName.productName}"></option>
                </select>

                <select th:unless="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}" th:field="*{retailProduct.product.productName.id}" required>
                    <option th:each="productName : ${allProductsNames}" th:value="${productName.id}" th:text="${productName.productName}">
                    </option>
                </select>
            </td>
            <td th:unless="${newPrestigeSaleUnit.basket.client.id != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Выбор модели машины -->
            <td th:if="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}">
                <select th:if="${newPrestigeSaleUnit.retailProduct.product.carModel != null}" required>
                    <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.carModel}"></option>
                </select>

                <select th:unless="${newPrestigeSaleUnit.retailProduct.product.carModel != null}" th:field="*{retailProduct.product.carModel}" required>
                    <option th:each="carModel : ${allCarModels}" th:value="${carModel}" th:text="${carModel}">
                    </option>
                </select>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Выбор артикула -->
            <td th:if="${newPrestigeSaleUnit.retailProduct.product.carModel != null}">
                <select th:if="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}" required>
                    <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.articleNumber}"></option>
                </select>

                <select th:unless="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}" th:field="*{retailProduct.product.articleNumber}" required>
                    <option th:each="articleNumber : ${allArticleNumbers}" th:value="${articleNumber}" th:text="${articleNumber}">
                    </option>
                </select>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.product.carModel != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Выбор бренда -->
            <td th:if="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}">
                <select th:if="${newPrestigeSaleUnit.retailProduct.product.brand != null}" required>
                    <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.brand.brandName}"></option>
                </select>

                <select th:unless="${newPrestigeSaleUnit.retailProduct.product.brand != null}" th:field="*{retailProduct.product.brand.id}" required>
                    <option th:each="brand : ${allBrands}" th:value="${brand.id}" th:text="${brand.brandName}">
                    </option>
                </select>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Ввод кол-ва -->
            <td th:if="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                         newPrestigeSaleUnit.retailProduct.product.brand.id != null}">
                <input type="number" th:field="*{quantity}" required>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                             newPrestigeSaleUnit.retailProduct.product.brand.id != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Ввод цены -->
            <td th:if="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                         newPrestigeSaleUnit.retailProduct.product.brand.id != null}">

                <div style="display: flex; align-items: center;">
                    <input type="number" name="soldPriceSmn" id="soldPriceSmn" th:field="*{soldPriceSmn}" required>
                    <span style="margin-left: 5px;">смн</span>
                </div>

            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                         newPrestigeSaleUnit.retailProduct.product.brand.id != null}">
                <a><b>...</b></a>
            </td>

            <!-- Показать сумму -->
            <td th:if="${newPrestigeSaleUnit.totalSumSmn != null}">

                <div style="display: flex; align-items: center;">
                    <a th:text="${newPrestigeSaleUnit.getTotalSumSmn()}"></a>
                    <span style="margin-left: 5px;">смн</span>
                </div>

            </td>
            <td th:unless="${newPrestigeSaleUnit.totalSumSmn != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Показать остаток -->
            <td th:if="${newPrestigeSaleUnit.getRetailProduct().getStockBalance() != null}">
                <a th:text="${newPrestigeSaleUnit.getRetailProduct().getStockBalance()}"></a>
            </td>
            <td th:unless="${newPrestigeSaleUnit.getRetailProduct().getStockBalance() != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

<!--             Показать цену в смн-->
            <td th:if="${newPrestigeSaleUnit.retailProduct.priceDollar != null}">
                <a th:text="${newPrestigeSaleUnit.getRetailProduct().getConvertedPriceToSmn(magicValue, exchangeRate)}"></a>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.priceDollar != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

<!--             Показать цену в долл-->
            <td th:if="${newPrestigeSaleUnit.retailProduct.priceDollar != null}">
                <a th:text="${newPrestigeSaleUnit.getRetailProduct().getPriceDollar()}"></a>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.priceDollar != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

<!--             Поле для отображения комментария -->
            <td th:if="${newPrestigeSaleUnit.retailProduct.product.notes != null}">
                <span th:text="${newPrestigeSaleUnit.retailProduct.product.notes}"></span>
            </td>
            <td th:unless="${newPrestigeSaleUnit.retailProduct.product.notes != null}" style="text-align: center;">
                <span><b>...</b></span>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${newPrestigeSaleUnit.totalSumSmn != null or (shouldCreateNewPrestigeSaleUnit != null and shouldCreateNewPrestigeSaleUnit == true)}">
        <button type="submit" name="action" value="add" style="margin-bottom: 10px;">Добавить новый товар</button>
    </div>
    <div th:if="${newPrestigeSaleUnit.totalSumSmn != null}">
        <button type="submit" name="action" value="save" style="margin-bottom: 10px;">Обновить и Сохранить карзину</button>
    </div>
    <div th:if="${newPrestigeSaleUnit.totalSumSmn == null and (shouldCreateNewPrestigeSaleUnit == null or shouldCreateNewPrestigeSaleUnit == false)}">
        <button type="submit" name="action" value="next" style="margin-bottom: 10px;">Далее</button>
    </div>
    <div th:if="${newPrestigeSaleUnit.basket.client != null and newPrestigeSaleUnit.basket.client.name != null and
                (shouldCreateNewPrestigeSaleUnit == null or shouldCreateNewPrestigeSaleUnit == false)}">
        <button type="submit" name="action" value="reset" style="margin-bottom: 10px;">Сбросить</button>
    </div>
</form>

</body>
</html>

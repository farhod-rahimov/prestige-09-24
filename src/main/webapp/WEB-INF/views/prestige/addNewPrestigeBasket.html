<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая корзина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        select, input[type="text"], input[type="tel"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Добавление новой корзины</h2>

<form th:method="POST" th:action="@{/prestige/productListManagement/addNewPrestigeBasket}" th:object="${newPrestigeBasket}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <!-- Поле для выбора клиента -->
    <label for="clientId">Клиент:</label>
    <select th:if="${newPrestigeBasket.client != null and newPrestigeBasket.client.name != null}" required>
        <option value="constant" selected th:text="${newPrestigeBasket.client.name}"></option>
    </select>
    <select th:unless="${newPrestigeBasket.client != null and newPrestigeBasket.client.name != null}" th:field="*{client.id}" id="clientId" required>
        <option th:each="client : ${allClients}" th:value="${client.id}" th:text="${client.name}">
            Выберите покупателя
        </option>
    </select>
    <br/>

    <input th:unless="${newPrestigeBasket.client != null and newPrestigeBasket.client.name != null}" type="submit" value="Сохранить клиента">

</form>

<form th:if="${newPrestigeBasket.client != null and newPrestigeBasket.client.name != null}"
      th:method="POST" th:action="@{/prestige/productListManagement/addNewPrestigeBasket}" th:object="${newPrestigeProduct}">

    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <!-- Таблица для выбора продуктов и редактирования корзины -->
    <table>
        <thead>
        <tr>
            <th>Имя продукта</th>
            <th>Модель машины</th>
            <th>Артикул</th>
            <!--            <th>Бренд</th>-->
<!--            <th>Цена</th>-->
<!--            <th>Остаток</th>-->
<!--            <th>Комментарий</th>-->
        </tr>
        </thead>
        <tbody>
        <tr>
            <!-- Выбор имени продукта -->
            <td>
                <select th:if="${newPrestigeProduct.product.productName.id != null}" required>
                    <option value="constant" selected th:text="${newPrestigeProduct.product.productName.productName}"></option>
                </select>

                <select th:unless="${newPrestigeProduct.product.productName.id != null}" th:field="*{product.productName.id}" required>
                    <option th:each="productName : ${allProductsNames}" th:value="${productName.id}" th:text="${productName.productName}">
                    </option>
                </select>
            </td>

            <!-- Выбор модели машины -->
            <td th:if="${newPrestigeProduct.product.productName.id != null}">
                <select th:if="${newPrestigeProduct.product.carModel != null}" required>
                    <option value="constant" selected th:text="${newPrestigeProduct.product.carModel}"></option>
                </select>

                <select th:unless="${newPrestigeProduct.product.carModel != null}" th:field="*{product.carModel}" required>
                    <option th:each="carModel : ${allCarModels}" th:value="${carModel}" th:text="${carModel}">
                    </option>
                </select>
            </td>
            <td th:unless="${newPrestigeProduct.product.productName.id != null}" style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Выбор артикула -->
            <td th:if="${newPrestigeProduct.product.carModel != null and newPrestigeProduct.product.articleNumber == null}">
                <select th:if="${newPrestigeProduct.product.articleNumber != null}" required>
                    <option value="constant" selected th:text="${newPrestigeProduct.product.articleNumber}"></option>
                </select>

                <select th:unless="${newPrestigeProduct.product.articleNumber != null}" th:field="*{product.articleNumber}" required>
                    <option th:each="articleNumber : ${allArticleNumbers}" th:value="${articleNumber}" th:text="${articleNumber}">
                    </option>
                </select>
            </td>
            <td th:unless="${newPrestigeProduct.product.carModel != null and newPrestigeProduct.product.articleNumber == null}"
                style="text-align: center;">
                <a><b>...</b></a>
            </td>

            <!-- Выбор бренда -->
<!--            <td>-->
<!--                <select th:field="*{products.brand}" required>-->
<!--                    <option th:each="brand : ${productList}" th:value="${brand.brandName}" th:text="${brand.brandName}">-->
<!--                    </option>-->
<!--                </select>-->
<!--            </td>-->

            <!-- Поле для редактирования цены -->
<!--            <td>-->
<!--                <input type="number" th:field="*{products.priceDollar}" step="0.01">-->
<!--            </td>-->

            <!-- Поле для отображения остатка -->
<!--            <td>-->
<!--                <span th:text="${product.stockBalance}"></span>-->
<!--            </td>-->

            <!-- Поле для отображения комментария -->
<!--            <td>-->
<!--                <span th:text="${product.notes}"></span>-->
<!--            </td>-->
        </tr>
        </tbody>
    </table>

    <input type="submit" value="Далее">
<!--    <input type="submit" value="Сохранить корзину">-->
</form>

</body>
</html>

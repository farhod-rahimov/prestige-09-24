<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая корзина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        select, input[type="text"], input[type="tel"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"], button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover, button[type="submit"]:hover {
            background-color: #45a049;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
        }
        .table-container {
            max-height: 600px;
            overflow-y: scroll;
        }
        .private-info {
            background-color: #a8ada8;
        }
    </style>
</head>
<body>

<h2>Добавление новой корзины</h2>

<form th:method="POST" th:action="@{/prestige/productListManagement/addNewPrestigeBasket}" th:object="${newBasket}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <table style="width: 20%; border-collapse: collapse">
        <thead>
            <tr>
                <th>Клиент</th>
                <th>Итого</th>
            </tr>
            <tr>
                <td>
                    <a th:if="${newBasket.client != null and newBasket.client.name != null}" th:text="${newBasket.client.name}"></a>
                    <select th:unless="${newBasket.client != null and newBasket.client.name != null}"
                            th:field="*{client.id}" id="clientId" required>
                        <option th:each="client : ${allClients}" th:value="${client.id}" th:text="${client.name}"></option>
                    </select>
                </td>
                <td>
                    <div style="display: flex; align-items: center;">
                        <input type="number" step="0.01" th:name="desiredTotalSum" th:value="*{totalSum}">
                        <span style="margin-left: 5px;">смн</span>
                    </div>
                </td>
            </tr>
        </thead>
    </table>

    <div class="table-container">
        <table>
            <!-- Таблица для выбора продуктов и редактирования корзины -->

            <thead>
            <tr>
                <th>Имя продукта</th>
                <th>Модель машины</th>
                <th>Артикул</th>
                <th>Бренд</th>
                <th>Кол-во</th>
                <th>Цена</th>
                <th>Сумма</th>
                <th class="private-info">Остаток ПОСЛЕ вычета товаров в корзине</th>
                <th class="private-info">Остаток ДО вычета товаров в корзине</th>
                <th class="private-info">(INNER SMN)</th>
                <th class="private-info">(INNER)</th>
                <th class="private-info">Комментарий</th>
                <th style="background-color: white;"></th>
            </tr>
            </thead>

            <tbody th:if="${newPrestigeSaleUnit != null}">

            <tr th:if="${shouldCreateNewPrestigeSaleUnit == null or shouldCreateNewPrestigeSaleUnit == false}">
                <td th:if="${newBasket.client != null and newBasket.client.id != null}">
                    <!-- Выбор имени продукта -->

                    <select th:if="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}" required>
                        <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.productName.productName}"></option>
                    </select>
                    <select th:unless="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}"
                            th:field="*{retailSaleUnitList[__*{retailSaleUnitList.size() - 1}__].retailProduct.product.productName.id}" required>
                        <option th:each="productName : ${allProductsNames}" th:value="${productName.id}" th:text="${productName.productName}">
                        </option>
                    </select>
                </td>
                <td th:unless="${newBasket.client != null and newBasket.client.id != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}">
                    <!-- Выбор модели машины -->

                    <select th:if="${newPrestigeSaleUnit.retailProduct.product.carModel != null}" required>
                        <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.carModel}"></option>
                    </select>
                    <select th:unless="${newPrestigeSaleUnit.retailProduct.product.carModel != null}"
                            th:field="*{retailSaleUnitList[__*{retailSaleUnitList.size() - 1}__].retailProduct.product.carModel}" required>

                        <option th:each="carModel : ${allCarModels}" th:value="${carModel}" th:text="${carModel}">
                        </option>
                    </select>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.product.productName.id != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.product.carModel != null}">
                    <!-- Выбор артикула -->

                    <select th:if="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}" required>
                        <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.articleNumber}"></option>
                    </select>
                    <select th:unless="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}"
                            th:field="*{retailSaleUnitList[__*{retailSaleUnitList.size() - 1}__].retailProduct.product.articleNumber}" required>

                        <option th:each="articleNumber : ${allArticleNumbers}" th:value="${articleNumber}" th:text="${articleNumber}">
                        </option>
                    </select>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.product.carModel != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}">
                    <!-- Выбор бренда -->

                    <select th:if="${newPrestigeSaleUnit.retailProduct.product.brand != null and newPrestigeSaleUnit.retailProduct.product.brand.id != null}" required>
                        <option value="constant" selected th:text="${newPrestigeSaleUnit.retailProduct.product.brand.brandName}"></option>
                    </select>
                    <select th:unless="${newPrestigeSaleUnit.retailProduct.product.brand != null and newPrestigeSaleUnit.retailProduct.product.brand.id != null}"
                            th:field="*{retailSaleUnitList[__*{retailSaleUnitList.size() - 1}__].retailProduct.product.brand.id}" required>

                        <option th:each="brand : ${allBrands}" th:value="${brand.id}" th:text="${brand.brandName}">
                        </option>
                    </select>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.product.articleNumber != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                             newPrestigeSaleUnit.retailProduct.product.brand.id != null}">
                    <!-- Ввод кол-ва -->

                    <input type="number" th:field="*{retailSaleUnitList[__*{retailSaleUnitList.size() - 1}__].quantity}" required>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                                 newPrestigeSaleUnit.retailProduct.product.brand.id != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                             newPrestigeSaleUnit.retailProduct.product.brand.id != null}">
                    <!-- Ввод цены -->

                    <div style="display: flex; align-items: center;">
                        <input type="number" step="0.01" th:field="*{retailSaleUnitList[__*{retailSaleUnitList.size() - 1}__].soldPriceSmn}" required>
                        <span style="margin-left: 5px;">смн</span>
                    </div>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.product.brand != null and
                             newPrestigeSaleUnit.retailProduct.product.brand.id != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.getTotalSumSmn() != null}">
                    <!-- Показать сумму -->

                    <div style="display: flex; align-items: center;">
                        <a th:text="${newPrestigeSaleUnit.getTotalSumSmn()}"></a>
                        <span style="margin-left: 5px;">смн</span>
                    </div>
                </td>
                <td th:unless="${newPrestigeSaleUnit.getTotalSumSmn() != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.getQuantity() != null}">
                    <!-- Остаток ПОСЛЕ вычета товаров в корзине  -->

                    <a th:text="${newPrestigeSaleUnit.getRetailProduct().getStockBalance()}"></a>
                </td>
                <td th:unless="${newPrestigeSaleUnit.getQuantity() != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.getRetailProduct() != null and newPrestigeSaleUnit.getRetailProduct().getStockBalance() != null}">
                    <!-- Остаток ДО вычета товаров в корзине  -->

                    <a th:if="${newPrestigeSaleUnit.getQuantity() != null}"
                       th:text="${newPrestigeSaleUnit.getRetailProduct().getStockBalance() + newPrestigeSaleUnit.quantity}"></a>

                    <a th:unless="${newPrestigeSaleUnit.getQuantity() != null}"
                       th:text="${newPrestigeSaleUnit.getRetailProduct().getStockBalance()}"></a>
                </td>
                </td>
                <td th:unless="${newPrestigeSaleUnit.getRetailProduct() != null and newPrestigeSaleUnit.getRetailProduct().getStockBalance() != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.priceDollar != null}">
                    <!-- Показать цену в смн-->

                    <a th:text="${newPrestigeSaleUnit.getRetailProduct().getConvertedPriceToSmn(magicValue, exchangeRate)}"></a>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.priceDollar != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.priceDollar != null}">
                    <!-- Показать цену в долл-->

                    <a th:text="${newPrestigeSaleUnit.getRetailProduct().getPriceDollar()}"></a>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.priceDollar != null}" style="text-align: center;">
                    <a><b>...</b></a>
                </td>

                <td th:if="${newPrestigeSaleUnit.retailProduct.product.notes != null}">
                    <!-- Поле для отображения комментария -->

                    <span th:text="${newPrestigeSaleUnit.retailProduct.product.notes}"></span>
                </td>
                <td th:unless="${newPrestigeSaleUnit.retailProduct.product.notes != null}" style="text-align: center;">
                    <span><b>...</b></span>
                </td>

                <!-- Кнопка удаления -->
                <td th:if="${newBasket.client != null and newBasket.client.id != null}" style="text-align: center;">
                    <a th:href="@{/prestige/productListManagement/deletePrestigeSaleUnit(removeIndex=${newBasket.retailSaleUnitList.size() - 1})}">
                        <img th:src="@{/images/delete.png}" alt="Удалить" style="width: 20px; height: 20px;">
                    </a>
                </td>
            </tr>

            <tr th:each="saleUnit, stat : *{retailSaleUnitList}">

                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getProduct().getProductName().getProductName()}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getProduct().getCarModel()}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getProduct().getArticleNumber()}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getProduct().getBrand().getBrandName()}"></a></td>


                <td th:if="${saleUnit.isSaved == true}">
                    <input type="number" step="0.01" th:field="*{retailSaleUnitList[__${stat.index}__].quantity}" required>
                </td>
                <td th:if="${saleUnit.isSaved == true}">
                    <input type="number" step="0.01" th:field="*{retailSaleUnitList[__${stat.index}__].soldPriceSmn}" required>
                </td>

                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getTotalSumSmn() + ' смн'}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getStockBalance()}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getStockBalance() + saleUnit.getQuantity()}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getConvertedPriceToSmn(magicValue, exchangeRate)}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getPriceDollar()}"></a></td>
                <td th:if="${saleUnit.isSaved == true}"><a th:text="${saleUnit.getRetailProduct().getProduct().getNotes()}"></a></td>

                <!-- Кнопка удаления -->
                <td th:if="${saleUnit.isSaved == true}" style="text-align: center;">
                    <a th:href="@{/prestige/productListManagement/deletePrestigeSaleUnit(removeIndex=${stat.index})}">

                        <img th:src="@{/images/delete.png}" alt="Удалить" style="width: 20px; height: 20px;">
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${shouldCreateNewPrestigeSaleUnit != null}">
        <button type="submit" name="action" value="add" style="margin-bottom: 10px;">Добавить новый товар</button>
        <button type="submit" name="action" value="update" style="margin-bottom: 10px;">Обновить и сохранить корзину</button>
    </div>
    <div th:if="${newPrestigeSaleUnit.getTotalSumSmn() != null}">
        <button type="submit" name="action" value="save" style="margin-bottom: 10px;">Сохранить новый товар</button>
    </div>
    <div th:if="${newPrestigeSaleUnit.getTotalSumSmn() == null and (shouldCreateNewPrestigeSaleUnit == null or shouldCreateNewPrestigeSaleUnit == false)}">
        <button type="submit" name="action" value="next" style="margin-bottom: 10px;">Далее</button>
    </div>
    <div th:if="${newBasket.client != null and newBasket.client.name != null and
                (shouldCreateNewPrestigeSaleUnit == null or shouldCreateNewPrestigeSaleUnit == false)}">
        <button type="submit" name="action" value="reset" style="margin-bottom: 10px;">Сбросить</button>
    </div>
</form>

</body>
</html>

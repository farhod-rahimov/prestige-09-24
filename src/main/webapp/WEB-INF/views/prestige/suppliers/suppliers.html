<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поставщики</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .add-supplier-link {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .add-supplier-link:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
        td:first-child, th:first-child {
            border-left: none;
        }
        td:last-child, th:last-child {
            border-right: none;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Список всех поставщиков</h2>
    <a href="/prestige/suppliers/add" class="add-supplier-link">Добавить нового поставщика</a>
</div>

<div th:if="${error}" class="error-message" th:text="${error}"></div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Наименование поставщика</th>
        <th>Контактное лицо</th>
        <th>Телефон</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="supplier : ${allSuppliers}" th:with="link=@{/prestige/suppliers/{supplierId}/(supplierId=${supplier.getId()})}">
        <td><a th:href="${link}" th:text="${supplier.getId()}"></a></td>
        <td><a th:href="${link}" th:text="${supplier.getStoreName()}"></a></td>
        <td><a th:href="${link}" th:text="${supplier.getName()}"></a></td>
        <td><a th:href="${link}" th:text="${supplier.getPhoneNumber()}"></a></td>
    </tr>
    </tbody>
</table>

</body>
</html>

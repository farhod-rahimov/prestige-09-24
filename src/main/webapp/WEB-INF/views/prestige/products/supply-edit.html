<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование оприходованного товара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            color: white;
            text-align: center;
        }
        button[type="submit"] {
            background-color: #4CAF50; /* Зеленый цвет для кнопки "Сохранить изменения" */
        }
        button[type="submit"]:hover {
            background-color: #45a049; /* Более темный зеленый при наведении */
        }
        button[name="method"][value="delete"] {
            background-color: #f44336; /* Красный цвет для кнопки "Удалить" */
        }
        button[name="method"][value="delete"]:hover {
            background-color: #d32f2f; /* Более темный красный при наведении */
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h2>Редактирование оприходованного товара</h2>

<form th:method="POST" th:action="@{/prestige/products}" th:object="${retailProduct}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <label for="productNameId">Название товара:</label>
    <select type="text" th:field="*{product.productName.productName}" id="productNameId" required>
        <option value="constant" selected th:value="*{product.productName.productName}" th:text="*{product.productName.productName}"></option>
    </select>

    <label for="carModel">Модель машины:</label>
    <select type="text" th:field="*{product.carModel}" id="carModel">
        <option value="constant" selected th:value="*{product.carModel}" th:text="*{product.carModel}"></option>
    </select>

    <label for="engineModel">Модель мотора:</label>
    <select type="text" th:field="*{product.engineModel}" id="engineModel">
        <option value="constant" selected th:value="*{product.engineModel}" th:text="*{product.engineModel}"></option>
    </select>

    <label for="oemArticleNumber">Артикул, OEM:</label>
    <select type="text" th:field="*{product.oemArticleNumber}" id="oemArticleNumber">
        <option value="constant" selected th:value="*{product.oemArticleNumber}" th:text="*{product.oemArticleNumber}"></option>
    </select>

    <label for="crossArticleNumber">Артикул, КРОСС:</label>
    <select type="text" th:field="*{product.crossArticleNumber}" id="crossArticleNumber">
        <option value="constant" selected th:value="*{product.crossArticleNumber}" th:text="*{product.crossArticleNumber}"></option>
    </select>

    <label for="brand">БРЕНД:</label>
    <select type="text" th:field="*{product.brand.brandName}" id="brand">
        <option value="constant" selected th:value="*{product.brand.brandName}" th:text="*{product.brand.brandName}"></option>
    </select>

    <label for="supplier">Поставщик:</label>
    <select type="text" th:field="*{supplier.storeName}" id="supplier">
        <option value="constant" selected th:text="*{supplier.storeName}" th:value="*{supplier.storeName}"></option>
    </select>

    <label for="quantity">Кол-во:</label>
    <input type="number" step="any" id="quantity" th:field="*{stockBalance}" required>

    <label for="priceDollar">Цена, $:</label>
    <input type="number" step="any" id="priceDollar" th:field="*{priceDollar}" required>

    <label for="dateTime">Дата и время оприходования:</label>
    <input type="datetime-local" id="dateTime" th:field="*{deliveryDateTime}" readonly>

    <div class="button-container">
        <button type="submit" name="method" value="put">Сохранить изменения</button>
        <button type="submit" name="method" value="delete"
                onclick="confirmDelete(event, 'Вы уверены, что хотите удалить этого клиента?')">Удалить</button>
    </div>
</form>

</body>
</html>

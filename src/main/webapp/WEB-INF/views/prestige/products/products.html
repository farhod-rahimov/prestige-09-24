<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title>Товары в магазине</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
        }
        .add-product-link {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .add-product-link:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
        td {
            text-align: left;
        }
        th:first-child, td:first-child {
            width: 100px;
            text-align: center;
        }
        th:nth-child(2), td:nth-child(2), th:nth-child(8), td:nth-child(8),
        th:nth-child(11), td:nth-child(11), th:nth-child(12), td:nth-child(12), th:nth-child(13), td:nth-child(13) {
            width: 60px;
            text-align: center;
        }
        th input,
        th select {
            width: 100%;
            box-sizing: border-box;
        }
        th select {
            margin-bottom: 6px;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        tr:target {
            outline: 3px solid black;
            animation: highlightRow 2s ease;
        }
        @keyframes highlightRow {
            0% { background-color: #ffe066; }
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        .private-info {
            background-color: #a8ada8;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
        .btn {
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-pink {
            background-color: #f06292;
        }
        .btn-pink:hover {
            background-color: #ec407a;
        }
        .btn-green {
            background-color: #4CAF50;
        }
        .btn-green:hover {
            background-color: #45a049;
        }
        .btn-blue {
            background-color: #2196F3;
        }
        .btn-blue:hover {
            background-color: #1976D2;
        }
        thead tr:first-child th {
            position: sticky;
            top: 60px; /* высота шапки */
            z-index: 2;
        }
        thead tr:nth-child(2) th {
            position: sticky;
            top: 138.5px; /* 60px шапка + 78.5px первая строка */
            z-index: 2;
        }
        tbody tr {
            scroll-margin-top: 188px; /* высота шапки + все sticky строки */
        }
    </style>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<form th:method="POST" th:action="@{/prestige/products}" th:object="${productStockFilter}">

    <div class="header">
        <h2>Товары в магазине</h2>

        <!-- Отображение сообщения об ошибке -->
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/prestige/supplies/baskets/add}" class="add-product-link">Оприходовать новый товар</a>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" name="method" class="btn btn-green" value="applyFilter">Применить фильтр</button>
                <button type="submit" name="method" class="btn btn-pink" value="resetFilter">Сбросить фильтр</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" name="method" class="btn btn-blue" value="applyFilterInList">Показать отфильтрованный товар в списке</button>
            </div>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>EQUIVALENT GROUP ID</th>
            <th>ID товара</th>
            <th>Название товара</th>
            <th>Модель машины</th>
            <th>Модель мотора</th>
            <th>Артикул, OEM</th>
            <th>Артикул, КРОСС</th>
            <th>Остаток</th>
            <th>Розничная цена, СМН</th>
            <th>Бренд</th>
            <th class="private-info">(INNER, SMN)</th>
            <th class="private-info">(INNER)</th>
            <th class="private-info">(INNER RECMND, SMN)</th>
            <th class="private-info">(MAGIC VALUE)</th>
            <th class="private-info">Комментарий</th>
        </tr>
        <tr>
            <th><input type="number" th:value="${productStockFilter.product.equivalentProductInfo.groupId}" th:field="*{product.equivalentProductInfo.groupId}" style="width: 100%;"></th>

            <th><input type="number" th:value="*{product.id}" th:field="*{product.id}" style="width: 100%;"></th>

            <th><input type="text" th:value="*{product.productName.productName}" th:field="*{product.productName.productName}" style="width: 100%;"></th>

            <th><input type="text" th:value="*{product.carModel}" th:field="*{product.carModel}" style="width: 100%;"></th>

            <th><input type="text" th:value="*{product.engineModel}" th:field="*{product.engineModel}" style="width: 100%;"></th>

            <th><input type="text" th:value="*{product.oemArticleNumber}" th:field="*{product.oemArticleNumber}" style="width: 100%;"></th>

            <th><input type="text" th:value="*{product.crossArticleNumber}" th:field="*{product.crossArticleNumber}" style="width: 100%;"></th>

            <th>
                <select th:field="*{stockBalanceComparison}">
                    <option value="GREATER_THAN">Больше (>)</option>
                    <option value="GREATER_OR_EQUALS_THAN">Больше или равно (>=)</option>
                    <option value="LESS_THAN">Меньше (<)</option>
                    <option value="LESS_OR_EQUALS_THAN">Меньше или равно (<=)</option>
                    <option value="EQUALS">Равно (=)</option>
                </select>
                <input type="number" step="1" th:value="*{stockBalance}" th:field="*{stockBalance}" style="width: 100%;">
            </th>

            <th></th>

            <th><input type="text" th:value="*{product.brand.brandName}" th:field="*{product.brand.brandName}" style="width: 100%;"></th>

            <th class="private-info"></th>

            <th class="private-info">
                <select th:field="*{innerPriceComparison}">
                    <option value="GREATER_THAN">Больше (>)</option>
                    <option value="GREATER_OR_EQUALS_THAN">Больше или равно (>=)</option>
                    <option value="LESS_THAN">Меньше (<)</option>
                    <option value="LESS_OR_EQUALS_THAN">Меньше или равно (<=)</option>
                    <option value="EQUALS">Равно (=)</option>
                </select>
                <input type="number" step="0.01" th:value="*{innerPrice}" th:field="*{innerPrice}" style="width: 100%;">
            </th>

            <th class="private-info"></th>

            <th class="private-info">
                <select th:field="*{marginComparison}">
                    <option value="GREATER_THAN">Больше (>)</option>
                    <option value="GREATER_OR_EQUALS_THAN">Больше или равно (>=)</option>
                    <option value="LESS_THAN">Меньше (<)</option>
                    <option value="LESS_OR_EQUALS_THAN">Меньше или равно (<=)</option>
                    <option value="EQUALS">Равно (=)</option>
                </select>
                <input type="number" step="0.01" th:value="*{margin}" th:field="*{margin}" style="width: 100%;">
            </th>

            <th class="private-info"><input type="text" th:value="*{product.notes}" th:field="*{product.notes}" style="width: 100%;"></th>
        </tr>
        <tr>
            <th style="background-color: #ffffff;" colspan="14"></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="productView : ${allProductsInStock}"
            th:id="'product-' + ${productView.getProduct().getId()}"
            th:with="link='/prestige/products/' + ${productView.getProduct().getId()} + '/supplies',
                     product=${productView.getProduct()},
                     groupId=${product.getEquivalentProductInfo().getGroupId()},
                     price=${utils.getConvertedPriceToSmn(productView.getPriceDollar(), productView.getMagicValue(), exchangeRate, 2)}"
            th:style="${groupId != 0} ? 'background-color: ' + ${utils.getBackgroundColorByGroupId(groupId)} : ''">

            <td th:if="${groupId != 0}"><a th:href="${link}" th:text="${groupId}"></a></td>
            <td th:unless="${groupId != 0}"></td>

            <td><a th:href="${link}" th:text="${product.getId()}"></a></td>
            <td><a th:href="${link}" th:text="${product.getProductName().getProductName()}"></a></td>
            <td><a th:href="${link}" th:text="${product.getCarModel()}"></a></td>
            <td><a th:href="${link}" th:text="${product.getEngineModel()}"></a></td>
            <td><a th:href="${link}" th:text="${product.getOemArticleNumber()}"></a></td>
            <td><a th:href="${link}" th:text="${product.getCrossArticleNumber()}"></a></td>

            <td><a th:href="${link}" th:text="${productView.getStockBalance()}"></a></td>
            <td><a th:href="${link}" th:text="${#numbers.formatInteger(price, 1) + ' СМН'}"></a></td>

            <td><a th:href="${link}" th:text="${product.getBrand().getBrandName()}"></a></td>
            <td><a th:href="${link}" th:text="${utils.getConvertedPriceToSmn(productView.getPriceDollar(), 0, exchangeRate, 2)}"></a></td>
            <td><a th:href="${link}" th:text="${productView.getPriceDollar()}"></a></td>

            <td th:if="${productView.getRecommendedPrice() != null}">
                <a th:href="${link}" th:text="${productView.getRecommendedPrice()}"></a>
            </td>
            <td th:unless="${productView.getRecommendedPrice() != null}">
                <a th:href="${link}" th:text="${#numbers.formatDecimal(price, 1, 2, 'POINT')}"></a>
            </td>

            <td><a th:href="${link}" th:text="${productView.getMagicValue()}"></a></td>

            <td><a th:href="${link}" th:title="${product.getNotes()}" th:text="${utils.getTruncatedText(product.getNotes(), 7)}"></a></td>
        </tr>
        </tbody>
    </table>
</form>

</body>
</html>

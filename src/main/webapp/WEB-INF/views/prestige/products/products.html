<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары в магазине</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .add-product-link {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .add-product-link:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
        td {
            text-align: left;
        }
        th:nth-child(1),
        td:nth-child(1) {
            width: 25ch; /* Устанавливаем ширину для первого столбца */
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        .private-info {
            background-color: #a8ada8;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Товары в магазине</h2>
    <a th:href="@{/prestige/products/add}" class="add-product-link">Оприходовать новый товар</a>
</div>

<div th:if="${error}" class="error-message" th:text="${error}"></div>

<table>
    <thead>
    <tr>
        <th>Название товара</th>
        <th>Модель машины</th>
        <th>Модель мотора</th>
        <th>Артикул, OEM</th>
        <th>Артикул, КРОСС</th>
        <th>Остаток</th>
        <th>Розничная цена, СМН</th>
        <th>Бренд</th>
        <th class="private-info">(INNER, SMN)</th>
        <th class="private-info">(INNER)</th>
        <th class="private-info">Комментарий</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productView : ${allProductsView}"
        th:with="link='/prestige/products/' + ${productView.getProduct().getId()} + '/supplies', product=${productView.getProduct()}">

        <td><a th:href="${link}" th:text="${product.getProductName().getProductName()}"></a></td>
        <td><a th:href="${link}" th:text="${product.getCarModel()}"></a></td>
        <td><a th:href="${link}" th:text="${product.getEngineModel()}"></a></td>
        <td><a th:href="${link}" th:text="${product.getOemArticleNumber()}"></a></td>
        <td><a th:href="${link}" th:text="${product.getCrossArticleNumber()}"></a></td>

        <td><a th:href="${link}" th:text="${utils.getFormattedBigDecimal(productView.getStockBalance(), 0)}"></a></td>
        <td><a th:href="${link}" th:text="${utils.getConvertedPriceToSmn(productView.getPriceDollar(), 20, 10.7, 0) + ' СМН'}"></a></td>

        <td><a th:href="${link}" th:text="${product.getBrand().getBrandName()}"></a></td>
        <td><a th:href="${link}" th:text="${utils.getConvertedPriceToSmn(productView.getPriceDollar(), 0, 10.7, 2)}"></a></td>
        <td><a th:href="${link}" th:text="${utils.getFormattedBigDecimal(productView.getPriceDollar(), 2)}"></a></td>

        <td><a th:href="${link}" th:title="${product.getNotes()}" th:text="${utils.getTruncatedText(product.getNotes(), 7)}"></a></td>
    </tr>
    </tbody>
</table>

</body>
</html>

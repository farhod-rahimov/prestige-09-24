<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары в магазине</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .form-container input[type="number"] {
            margin-right: 10px;
            padding: 5px;
            width: 120px;
        }
        .form-container button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center; /* Выравнивание текста в шапке по центру */
        }
        td:first-child, th:first-child {
            border-left: none;
        }
        td:last-child, th:last-child {
            border-right: none;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<h2>Товары в магазине</h2>

<div class="form-container">
    <form th:action="@{/prestige/productListManagement/showAllPrestigeProducts}" method="get">
        <label for="magicValue">Magic-Value:</label>
        <input type="number" step="0.01" name="magicValue" id="magicValue"
               th:value = "${magicValue}" required>

        <label for="exchangeRate">Ex-Rate:</label>
        <input type="number" step="0.01" name="exchangeRate" id="exchangeRate"
               th:value = "${exchangeRate}" required>
        <button type="submit">Обновить</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>Назавние товара</th>
        <th>Модель машины</th>
        <th>Артикул</th>
        <th>Бренд</th>
        <th>Розничная цена</th>
        <th>Остаток</th>
        <th>Комментарий</th>
        <th>(INNER)</th>
    </tr>
    </thead>
    <tbody>
        <tr th:each="prestigeProduct : ${allPrestigeProducts}">

            <td><a th:text="${prestigeProduct.getProduct().getProductName().getProductName()}"></a></td>
            <td><a th:text="${prestigeProduct.getProduct().getCarModel()}"></a></td>
            <td><a th:text="${prestigeProduct.getProduct().getArticleNumber()}"></a></td>
            <td><a th:text="${prestigeProduct.getProduct().getBrand().getBrandName()}"></a></td>
            <td><a th:text="${prestigeProduct.getConvertedPriceToSmn(magicValue, exchangeRate) + ' смн'}"></a></td>
            <td><a th:text="${prestigeProduct.getStockBalance()}"></a></td>
            <td><a th:text="${prestigeProduct.getProduct().getNotes()}"></a></td>
            <td><a th:text="${prestigeProduct.getPriceDollar()}"></a></td>
        </tr>
    </tbody>
</table>

</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title>История продаж</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
        }
        .add-product-link {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .add-product-link:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
        td {
            text-align: left;
        }
        th:first-child, td:first-child {
            width: 100px;
            text-align: center;
        }
        th:nth-child(2), td:nth-child(2), th:nth-child(8), td:nth-child(8),
        th:nth-child(11), td:nth-child(11), th:nth-child(14), td:nth-child(14) {
            width: 60px;
            text-align: center;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        .private-info {
            background-color: #a8ada8;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
        .btn {
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-pink {
            background-color: #f06292;
        }
        .btn-pink:hover {
            background-color: #ec407a;
        }
        .btn-green {
            background-color: #4CAF50;
        }
        .btn-green:hover {
            background-color: #45a049;
        }
        thead tr:first-child th {
            position: sticky;
            top: 60px; /* высота шапки */
            z-index: 2;
        }
        thead tr:nth-child(2) th {
            position: sticky;
            top: 120px; /* шапка + первая строка */
            z-index: 2;
        }
    </style>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<form th:method="POST" th:action="@{/prestige/sales/history}" th:object="${prestigeSalesHistoryFilter}">

    <div class="header">
        <h2>История продаж</h2>

        <!-- Отображение сообщения об ошибке -->
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" name="method" class="btn btn-green" value="applyFilter">Применить фильтр</button>
            <button type="submit" name="method" class="btn btn-pink" value="resetFilter">Сбросить фильтр</button>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>EQUIVALENT GROUP ID</th>
            <th>ID товара</th>
            <th>Название товара</th>
            <th>Модель машины</th>
            <th>Модель мотора</th>
            <th>Артикул, OEM</th>
            <th>Артикул, КРОСС</th>
            <th>Кол-во</th>
            <th>Проданная цена, СМН</th>
            <th>Бренд</th>
            <th class="private-info">(INNER)</th>
            <th class="private-info">Имя клиента</th>
            <th class="private-info">Дата и время продажи</th>
            <th class="private-info">Номер корзины</th>
            <th class="private-info">Комментарий</th>
        </tr>
        <tr>
            <th><input type="number" th:field="*{product.equivalentProductInfo.groupId}" style="width: 100%;"></th>

            <th><input type="number" th:field="*{product.id}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{product.productName.productName}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{product.carModel}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{product.engineModel}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{product.oemArticleNumber}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{product.crossArticleNumber}" style="width: 100%;"></th>

            <th></th>

            <th></th>

            <th><input type="text" th:field="*{product.brand.brandName}" style="width: 100%;"></th>

            <th class="private-info"></th>

            <th class="private-info"><input type="text" th:field="*{clientName}" style="width: 100%;"></th>

            <th class="private-info"><input type="date" th:field="*{soldDate}" style="width: 100%;"></th>

            <th class="private-info"><input type="number" th:field="*{basketId}" style="width: 100%;"></th>

            <th class="private-info"><input type="text" th:field="*{product.notes}" style="width: 100%;"></th>
        </tr>
        </thead>
        <tbody>

        <tr>
            <td colspan="15"></td>
        </tr>

        <th:block th:each="basket : ${allBaskets}">
            <tr th:each="sale : ${basket.getSalesList()}"
                th:with="product=${sale.getProduct()},
                         groupId=${sale.product.getEquivalentProductInfo().getGroupId()}"
                th:style="${groupId != 0} ? 'background-color: ' + ${utils.getBackgroundColorByGroupId(groupId)} : ''">

                <td th:if="${groupId != 0}" th:text="${groupId}"></td>
                <td th:unless="${groupId != 0}"></td>

                <td><a th:text="${product.getId()}"></a></td>
                <td><a th:text="${product.getProductName().getProductName()}"></a></td>
                <td><a th:text="${product.getCarModel()}"></a></td>
                <td><a th:text="${product.getEngineModel()}"></a></td>
                <td><a th:text="${product.getOemArticleNumber()}"></a></td>
                <td><a th:text="${product.getCrossArticleNumber()}"></a></td>

                <td><a th:text="${sale.getQuantity()}"></a></td>
                <td><a th:text="${sale.getSoldPrice() + ' СМН'}"></a></td>

                <td><a th:text="${product.getBrand().getBrandName()}"></a></td>
                <td><a th:text="${sale.getWholesalePrice()}"></a></td>

                <td><a th:text="${basket.getClient().getName()}"></a></td>
                <td><a th:text="${basket.getLastChangedDateTime()}"></a></td>
                <td><a th:href="'/prestige/sales/baskets/' + ${basket.getId()}" th:text="${basket.getId()}"></a></td>

                <td><a th:title="${product.getNotes()}" th:text="${utils.getTruncatedText(product.getNotes(), 7)}"></a></td>
            </tr>
        </th:block>

        </tbody>
    </table>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все корзины</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center; /* Выравнивание текста в шапке по центру */
            border-top: 1px solid #ddd;
            border-left: 1px solid #ddd;
        }
        td {
            text-align: left; /* Выравнивание текста в ячейках слева */
        }
        td:first-child, th:first-child {
            border-left: none;
        }
        td:last-child, th:last-child {
            border-right: none;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .id-column {
            width: 10%;
        }
        .date-time-column {
            width: 25%;
        }
        .name-column {
            width: 35%;
        }
        .amount-column {
            width: 20%;
        }
    </style>
</head>
<body>

<h2>Все корзины</h2>

<table>
    <thead>
    <tr>
        <th class="id-column">ID</th>
        <th class="date-time-column">Дата и время создания</th>
        <th class="date-time-column">Дата и время последнего изменения</th>
        <th class="name-column">Имя клиента</th>
        <th class="amount-column">Сумма</th>
    </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>04.09.2024 14:30</td>
            <td>04.09.2024 14:55</td>
            <td>Иван Иванов</td>
            <td>5,000₽</td>
        </tr>
        <tr>
            <td>2</td>
            <td>04.09.2024 15:00</td>
            <td>04.09.2024 15:12</td>
            <td>Мария Петрова</td>
            <td>12,300₽</td>
        </tr>
        <tr>
            <td>3</td>
            <td>04.09.2024 16:15</td>
            <td>04.09.2024 16:11</td>
            <td>Алексей Смирнов</td>
            <td>7,800₽</td>
        </tr>

        <tr th:each="basket : ${allBaskets}">

            <td><a th:href="@{/prestige/sales/{basketId}/(basketId=${basket.getId()})}" th:text="${basket.getId()}"></a></td>
            <td><a th:href="@{/prestige/sales/{basketId}/(basketId=${basket.getId()})}" th:text="${basket.getCreatedDateTimeFormatted()}"></a></td>
            <td><a th:href="@{/prestige/sales/{basketId}/(basketId=${basket.getId()})}" th:text="${basket.getLastChangedDateTimeFormatted()}"></a></td>
            <td><a th:href="@{/prestige/sales/{basketId}/(basketId=${basket.getId()})}" th:text="${basket.getClient().getName()}"></a></td>
            <td><a th:href="@{/prestige/sales/{basketId}/(basketId=${basket.getId()})}" th:text="${basket.getTotalSum()}"></a></td>

        </tr>
    </tbody>
</table>

</body>
</html>

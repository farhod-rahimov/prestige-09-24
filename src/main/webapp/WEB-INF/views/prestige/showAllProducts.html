<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center; /* Выравнивание текста в шапке по центру */
        }
        td:first-child, th:first-child {
            border-left: none;
        }
        td:last-child, th:last-child {
            border-right: none;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<h2>Товары</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Назавние товара</th>
        <th>Модель машины</th>
        <th>Артикул</th>
        <th>Бренд</th>
        <th>Комментарий</th>
    </tr>
    </thead>
    <tbody>
        <tr th:each="product : ${allProducts}">

            <td><a th:text="${product.getId()}"></a></td>
            <td><a th:text="${product.getProductName().getProductName()}"></a></td>
            <td><a th:text="${product.getCarModel()}"></a></td>
            <td><a th:text="${product.getArticleNumber()}"></a></td>
            <td><a th:text="${product.getBrand().getBrandName()}"></a></td>
            <td><a th:text="${product.getNotes()}"></a></td>

        </tr>
    </tbody>
</table>

</body>
</html>

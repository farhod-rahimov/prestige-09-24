<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title>Склад</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0; /* Убираем стандартные отступы */
            padding: 0; /* Убираем стандартные отступы */
            padding-top: 60px;
        }

        .container {
            display: flex; /* Располагаем блоки по горизонтали */
            align-items: center; /* Вертикальное выравнивание по центру */
            padding: 10px; /* Внутренний отступ, чтобы блоки не прилипали к краю */
        }

        .block {
            width: 250px; /* Ширина блоков */
            height: 100px; /* Высота блоков */
            border: 1px solid black; /* Граница блоков */
            margin-right: 20px; /* Отступ между блоками */
            display: flex; /* Используем flex для выравнивания содержимого */
            align-items: center; /* Вертикальное выравнивание по центру */
            justify-content: center; /* Горизонтальное выравнивание по центру */
            text-align: center;
            padding: 10px; /* Внутренний отступ */
            box-sizing: border-box; /* Учитываем отступы и границы в ширине и высоте */
            background-color: #4CAF50; /* Зеленая заливка */
            color: white; /* Белый текст */
            transition: background-color 0.3s ease; /* Плавное изменение фона */
        }

        .block a {
            text-decoration: none; /* Убираем стандартное подчеркивание у ссылок */
            color: white; /* Белый цвет текста */
            font-weight: bold; /* Полужирный шрифт */
            font-size: 1rem;
        }

        .block a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }

        .block h2 {
            white-space: normal; /* Разрешить перенос текста */
            margin: 0; /* Удалить стандартные отступы h2 */
        }
    </style>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<div class="container">
    <div class="block">
        <a href="/sklad/products"><h2>Показать все товары на складе</h2></a>
    </div>


</div>

<div class="container">
    <div class="block">
        <a href="/sklad/supplies/baskets"><h2>Поступления</h2></a>
    </div>

    <div class="block">
        <a href="/sklad/supplies/baskets/add"><h2>Оприходовать новый товар на склад</h2></a>
    </div>
</div>

<div class="container">
    <div class="block">
        <a href="/sklad/sales/baskets"><h2>Продажи</h2></a>
    </div>

    <div class="block">
        <a href="/sklad/sales/history"><h2>Полная история продаж</h2></a>
    </div>
</div>

<div class="container">
    <div class="block">
        <a href="/sklad/clients"><h2>Клиенты</h2></a>
    </div>

    <div class="block">
        <a href="/sklad/suppliers"><h2>Поставщики</h2></a>
    </div>
</div>

<div class="container">
    <div class="block">
        <a href="/sklad/product-management"><h2>Управление номенклатурой товаров</h2></a>
    </div>
</div>

<div class="container">
    <div class="block">
        <a href="/sklad/settings"><h2>Настройки</h2></a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title th:if="${skladSalesBasket != null && skladSalesBasket.getId() != null}" th:text="'Корзина №'+ ${skladSalesBasket.getId()}"></title>
    <title th:unless="${skladSalesBasket != null && skladSalesBasket.getId() != null}">Новая корзина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            text-align: left;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
       .client-table {
            width: 50%;
        }
        .button-container {
            position: sticky;
            bottom: 0;
            background-color: #fff;
            padding: 15px;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 10;
        }
        .btn {
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-green {
            background-color: #4CAF50;
        }
        .btn-green:hover {
            background-color: #45a049;
        }
        .btn-blue {
            background-color: #2196F3;
        }
        .btn-blue:hover {
            background-color: #1976D2;
        }
        .btn-orange {
            background-color: #ff9800;
        }
        .btn-orange:hover {
            background-color: #fb8c00;
        }
        .btn-purple {
            background-color: #ba68c8;
        }
        .btn-purple:hover {
            background-color: #9c27b0;
        }
        .btn-red {
            background-color: #f66f6f;
        }
        .btn-red:hover {
            background-color: #f44336;
        }
        .btn-pink {
            background-color: #f06292;
        }
        .btn-pink:hover {
            background-color: #ec407a;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        .private-info {
            background-color: #a8ada8;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
        .client-table {
            width: 50%;
        }
        input[type="checkbox"].styled-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #4CAF50;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<h2 th:if="${skladSalesBasket != null && skladSalesBasket.getId() != null}" th:text="'Корзина №'+ ${skladSalesBasket.getId()}"></h2>
<h2 th:unless="${skladSalesBasket != null && skladSalesBasket.getId() != null}">Новая корзина</h2>

<form th:method="POST" th:action="@{/sklad/sales/baskets}" th:object="${skladSalesBasket}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <h3>Клиент</h3>

    <table class="client-table">
        <thead>
        <tr>
            <th>Имя клиента</th>
            <th>Телефон</th>
            <th>Общая сумма корзины</th>
            <th>Комментарий</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${skladSalesStep.value == 'CLIENT_NAME_SELECTION'}">
            <td>
                <select type="text" th:field="*{client.name}" required>
                    <option th:each="clientName : ${allClientNames}" th:value="${clientName}" th:text="${clientName}">Выберите имя клиента</option>
                </select>
            </td>
            <td th:each="i : ${#numbers.sequence(1, 1)}">
                <select required><option value="constant" selected>...</option></select>
            </td>
            <td th:each="i : ${#numbers.sequence(1, 2)}">
                <input type="text" th:value="..." readonly>
            </td>
        </tr>

        <tr th:if="${skladSalesStep.value == 'CLIENT_PHONE_NUMBER_SELECTION'}">
            <td>
                <select required>
                    <option value="constant" selected th:text="${skladSalesBasket.getClient().getName()}"></option>
                </select>
            </td>
            <td>
                <select type="text" th:field="*{client.phoneNumber}" required>
                    <option th:each="phoneNumber : ${allPhoneNumbers}" th:value="${phoneNumber}" th:text="${phoneNumber}">Выберите номер телефона</option>
                </select>
            </td>
            <td th:each="i : ${#numbers.sequence(1, 2)}">
                <input type="text" th:value="..." readonly>
            </td>
        </tr>

        <tr th:if="${utils.clientSelectionDone(skladSalesStep)}">
            <td>
                <select required>
                    <option value="constant" selected th:text="${skladSalesBasket.getClient().getName()}"></option>
                </select>
            </td>
            <td>
                <select required>
                    <option value="constant" selected th:text="${skladSalesBasket.getClient().getPhoneNumber()}"></option>
                </select>
            </td>
            <td>
                <input type="text" th:value="${skladSalesBasket.getTotalSum()}" readonly>
            </td>
            <td>
                <input type="text" th:field="*{notes}">
            </td>
        </tr>
        </tbody>
    </table>

    <h3>Товары в корзине</h3>

    <table>
        <thead>
            <tr>
                <th>Название товара</th>
                <th>Модель машины</th>
                <th>Модель мотора</th>
                <th>Артикул, OEM</th>
                <th>Артикул, КРОСС</th>
                <th>БРЕНД</th>
                <th>Количество</th>
                <th>Цена, ДОЛЛАР</th>
                <th>Сумма, ДОЛЛАР</th>
                <th class="private-info">Остаток до<br>реализации</th>
                <th class="private-info">(INNER)</th>
                <th class="private-info"></th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_WITH_FILTER'}">
                <td>
                    <input type="text" th:field="*{filter.productName}">
                </td>
                <td>
                    <input type="text" th:field="*{filter.carModel}">
                </td>
                <td>
                    <input type="text" th:field="*{filter.engineModel}">
                </td>
                <td>
                    <input type="text" th:field="*{filter.oemArticleNumber}">
                </td>
                <td>
                    <input type="text" th:field="*{filter.crossArticleNumber}">
                </td>
                <td>
                    <input type="text" th:field="*{filter.brand}">
                </td>
                <td th:each="i : ${#numbers.sequence(1, 5)}">...</td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_NAME_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td th:if="${#lists.isEmpty(allProductNames)}">
                    Нет товаров для выбора
                </td>
                <td th:unless="${#lists.isEmpty(allProductNames)}">
                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.productName.id}" required>
                        <option th:each="productName : ${allProductNames}" th:value="${productName.id}" th:text="${productName.productName}">
                            Выберите название товара
                        </option>
                    </select>
                </td>
                <td th:each="i : ${#numbers.sequence(1, 10)}">...</td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_CAR_MODEL_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                    </select>
                </td>
                <td>
                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.carModel}" required>
                        <option th:each="carModel : ${allCarModels}" th:value="${carModel}" th:text="${carModel}">
                            Выберите модель машины
                        </option>
                    </select>
                </td>
                <td th:each="i : ${#numbers.sequence(1, 9)}">...</td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_ENGINE_MODEL_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.carModel}"></option>
                    </select>
                </td>
                <td>
                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.engineModel}">
                        <option th:each="engineModel : ${allEngineModels}" th:value="${engineModel}" th:text="${engineModel}">
                            Выберите модель мотора
                        </option>
                    </select>
                </td>
                <td th:each="i : ${#numbers.sequence(1, 8)}">...</td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_OEM_ARTICLE_NUMBER_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.carModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.engineModel}"></option>
                    </select>
                </td>
                <td>
                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.oemArticleNumber}">
                        <option th:each="oemArticleNumber : ${allOemArticleNumbers}" th:value="${oemArticleNumber}" th:text="${oemArticleNumber}">
                            Выберите OEM артикул
                        </option>
                    </select>
                </td>
                <td th:each="i : ${#numbers.sequence(1, 7)}">...</td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_CROSS_ARTICLE_NUMBER_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.carModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.engineModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.oemArticleNumber}"></option>
                    </select>
                </td>
                <td>
                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.crossArticleNumber}">
                        <option th:each="crossArticleNumber : ${allCrossArticleNumbers}" th:value="${crossArticleNumber}" th:text="${crossArticleNumber}">
                            Выберите КРОСС артикул
                        </option>
                    </select>
                </td>
                <td th:each="i : ${#numbers.sequence(1, 6)}">...</td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_BRAND_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.carModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.engineModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.oemArticleNumber}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.crossArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.crossArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.crossArticleNumber}"></option>
                    </select>
                </td>
                <td>
                    <select type="text" th:field="*{salesList[__${lastIndex}__].product.brand.id}">
                        <option th:each="brand : ${allBrands}" th:value="${brand.id}" th:text="${brand.brandName}">
                            Выберите бренд
                        </option>
                    </select>
                </td>
                <td th:each="i : ${#numbers.sequence(1, 5)}">...</td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${skladSalesStep.value == 'PRODUCT_QUANTITY_AND_PRICE_SELECTION'}" th:with="lastIndex=${skladSalesBasket.salesList.size() - 1}">
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.productName.productName}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.carModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.engineModel == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.engineModel}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.oemArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.oemArticleNumber}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option th:if="*{salesList[__${lastIndex}__].product.crossArticleNumber == null}" value="constant" selected th:text="'(пусто)'"></option>
                        <option th:unless="*{salesList[__${lastIndex}__].product.crossArticleNumber == null}" value="constant" selected th:text="*{salesList[__${lastIndex}__].product.crossArticleNumber}"></option>
                    </select>
                </td>
                <td>
                    <select required>
                        <option value="constant" selected th:text="*{salesList[__${lastIndex}__].product.brand.brandName}"></option>
                    </select>
                </td>
                <td>
                    <input type="number" step="1" id="quantity" th:field="*{salesList[__${lastIndex}__].quantity}" required>
                </td>
                <td>
                    <input type="number" step="any" id="price" th:field="*{salesList[__${lastIndex}__].soldPrice}" required>
                </td>
                <td>
                    <input th:if="${skladSalesBasket.salesList[lastIndex].quantity == null}" type="text" th:value="0" readonly>
                    <input th:unless="${skladSalesBasket.salesList[lastIndex].quantity == null}" type="text"
                           th:value="${skladSalesBasket.salesList[lastIndex].quantity * skladSalesBasket.salesList[lastIndex].soldPrice}" readonly>
                </td>
                </td>
                <td>
                    <input type="text" th:value="*{salesList[__${lastIndex}__].stockBeforeSale}" readonly>
                </td>
                <td>
                    <input type="text" th:value="*{salesList[__${lastIndex}__].wholesalePrice}" readonly>
                </td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${utils.shouldShowAddedItemsInTheBasket(skladSalesStep, skladSalesBasket.salesList, iterStat.last)}"
                th:each="sales, iterStat : ${skladSalesBasket.salesList}">

                <td th:text="*{salesList[__${iterStat.index}__].product.productName.productName}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].product.carModel}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].product.engineModel}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].product.oemArticleNumber}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].product.crossArticleNumber}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].product.brand.brandName}"></td>

                <td>
                    <input type="number" step="1" th:field="*{salesList[__${iterStat.index}__].quantity}" required>
                </td>
                <td>
                    <input type="number" step="any" th:field="*{salesList[__${iterStat.index}__].soldPrice}" required>
                </td>

                <td th:text="${skladSalesBasket.salesList[iterStat.index].quantity * skladSalesBasket.salesList[iterStat.index].soldPrice}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].stockBeforeSale}"></td>
                <td th:text="*{salesList[__${iterStat.index}__].wholesalePrice}"></td>

                <td th:if="${utils.shouldShowCheckBox(skladSalesStep)}">
                    <input type="checkbox" name="selectedSalesIds" class="styled-checkbox" th:value="*{salesList[__${iterStat.index}__].id}">
                </td>
                <td th:unless="${utils.shouldShowCheckBox(skladSalesStep)}">
                </td>
            </tr>
        </tbody>
    </table>

    <div class="button-container" style="display: block;"
         th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_DONE' or skladSalesStep.value == 'PRODUCT_SELECTION_WITH_FULL_LIST'}">

        <div style="margin-bottom: 15px; text-align: center;">
            <button th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_DONE'}"
                    type="submit" name="method" class="btn btn-blue" value="post">Добавить новый товар</button>

            <button th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_DONE'}"
                    type="submit" name="method" class="btn btn-blue" value="changeBasketType">

                Добавление товаров через полный список
            </button>

            <button th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_WITH_FULL_LIST'}"
                    type="submit" name="method" class="btn btn-blue" value="changeBasketType">

                Добавление товаров через частичный список
            </button>

            <button th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_DONE'}" type="submit" name="method" value="deleteSelected"
                    onclick="return confirm('Удалить выбранные товары?')"
                    class="btn btn-red">Удалить выбранные товары</button>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button th:if="${skladSalesBasket.getStatus().getIntValue() == 3}"
                    type="submit" name="method" value="markAsSold"
                    class="btn btn-orange">Продать корзину</button>

            <button type="submit" name="method" class="btn btn-green" value="patch">Закрыть корзину с сохранением</button>

            <button type="submit" name="method" value="close"
                    onclick="return confirm('Вы уверены, что хотите закрыть корзину без сохранения?')"
                    class="btn btn-pink">Закрыть корзину без сохранения</button>

            <button th:if="${skladSalesBasket.getStatus().getIntValue() == 1 or skladSalesBasket.getStatus().getIntValue() == 3}"
                    type="submit" name="method" value="delete"
                    onclick="return confirm('Вы уверены, что хотите удалить корзину?')"
                    class="btn btn-red">Удалить корзину</button>

            <button th:if="${skladSalesBasket.getStatus().getIntValue() == 2}"
                    type="submit" name="method" value="markAsSold"
                    class="btn btn-purple">Восстановить корзину</button>
        </div>
    </div>
    <div class="button-container" th:if="${utils.shouldShowNextButton(skladSalesStep, allProductNames)}">
        <button th:if="${skladSalesStep.value != 'PRODUCT_SELECTION_WITH_FULL_LIST'}"
                type="submit" name="method" class="btn btn-green" value="post">Далее</button>

        <button th:if="${skladSalesStep.value == 'PRODUCT_NAME_SELECTION'}"
                type="submit" name="method" class="btn btn-orange"
                value="changeSearchType">Изменить выбор товаров через ФИЛЬТР</button>

        <button th:if="${skladSalesStep.value == 'PRODUCT_SELECTION_WITH_FILTER'}"
                type="submit" name="method" class="btn btn-orange"
                value="changeSearchType">Изменить выбор товаров через СПИСОК</button>
    </div>
</form>

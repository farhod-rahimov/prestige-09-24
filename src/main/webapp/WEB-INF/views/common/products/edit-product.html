<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title>Редактирование товара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        select, input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            color: white;
            text-align: center;
        }
        button[type="submit"] {
            background-color: #4CAF50; /* Зеленый цвет для кнопки "Сохранить изменения" */
        }
        button[type="submit"]:hover {
            background-color: #45a049; /* Более темный зеленый при наведении */
        }
        button[name="method"][value="delete"] {
            background-color: #f44336; /* Красный цвет для кнопки "Удалить" */
        }
        button[name="method"][value="delete"]:hover {
            background-color: #d32f2f; /* Более темный красный при наведении */
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
    </style>
    <script th:src="@{/js/confirm-delete.js}"></script>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<h2>Редактирование товара</h2>

<form method="POST" th:action="@{${'/' + URIBeginning + '/product-management/products'}}" th:object="${product}">

    <!-- Отображение сообщения об ошибке -->
    <div class="error-message" th:if="${error}" th:text="${error}"></div>

    <input type="hidden" id="id" th:field="*{id}" required>

    <label for="productNameId">Название товара:</label>
    <select type="text" th:field="*{productName.id}" id="productNameId" required>
        <option th:each="productName : ${allProductNames}" th:value="${productName.id}" th:text="${productName.productName}">Выберите название товара</option>
    </select>

    <label for="carModel">Модель машины:</label>
    <input type="text" th:field="*{carModel}" id="carModel" required>

    <label for="carModel">Модель мотора:</label>
    <input type="text" th:field="*{engineModel}" id="engineModel">

    <label for="oemArticleNumber">Артикул, OEM:</label>
    <input type="text" th:field="*{oemArticleNumber}" id="oemArticleNumber">

    <label for="crossArticleNumber">Артикул, КРОСС:</label>
    <input type="text" th:field="*{crossArticleNumber}" id="crossArticleNumber">

    <label for="brandId">Бренд:</label>
    <select type="text" th:field="*{brand.id}" id="brandId" required>
        <option th:each="brand : ${allBrands}" th:value="${brand.id}" th:text="${brand.brandName}">Выберите бренд</option>
    </select>

    <label for="notes">Комментарий:</label>
    <input type="text" th:field="*{notes}" id="notes">

    <div class="button-container">
        <button type="submit" name="method" value="put">Сохранить изменения</button>
        <button type="submit" name="method" value="delete"
                onclick="confirmDelete(event, 'Вы уверены, что хотите удалить этот товар?')">Удалить</button>
    </div>
</form>

</body>
</html>

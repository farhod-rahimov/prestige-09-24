<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title>Новый товар</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            text-align: left;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .button-container {
            position: sticky;
            bottom: 0;
            background-color: #fff;
            padding: 15px;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 10;
        }
        .btn {
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-green {
            background-color: #4CAF50;
        }
        .btn-green:hover {
            background-color: #45a049;
        }
        .btn-blue {
            background-color: #2196F3;
        }
        .btn-blue:hover {
            background-color: #1976D2;
        }
        .btn-red {
            background-color: #f66f6f;
        }
        .btn-red:hover {
            background-color: #f44336;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        input[type="checkbox"].styled-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #4CAF50;
            cursor: pointer;
        }
        thead tr:first-child th {
            position: sticky;
            top: 60px; /* высота шапки */
            z-index: 2;
        }
    </style>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<div class="header">
    <h2>Добавление нового товара</h2>
</div>

<form th:method="POST" th:action="@{${'/' + URIBeginning + '/product-management/products'}}" th:object="${product}">
    <!-- Отображение сообщения об ошибке -->
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <input type="hidden" name="tabId" th:value="${tabId}">

    <table>
        <thead>
            <tr>
                <th>Название товара</th>
                <th>Модель машины</th>
                <th>Модель мотора</th>
                <th>Артикул, OEM</th>
                <th>Артикул, КРОСС</th>
                <th>БРЕНД</th>
                <th>Комментарий</th>
                <th></th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${productStep.value == 'PRODUCT_NAME_SELECTION'}">
                <td>
                    <select type="text" th:field="*{productName.id}" required>
                        <option th:each="productName : ${allProductNames}" th:value="${productName.id}" th:text="${productName.productName}">
                            Выберите название товара
                        </option>
                    </select>
                </td>
                <td>
                    <input type="text" th:field="*{carModel}" required>
                </td>
                <td>
                    <input type="text" th:field="*{engineModel}">
                </td>
                <td>
                    <input type="text" th:field="*{oemArticleNumber}">
                </td>
                <td>
                    <input type="text" th:field="*{crossArticleNumber}">
                </td>
                <td>
                    <select type="text" th:field="*{brand.id}" id="brandId" required>
                        <option th:each="brand : ${allBrands}" th:value="${brand.id}" th:text="${brand.brandName}">
                            Выберите бренд
                        </option>
                    </select>
                </td>
                <td>
                    <input type="text" th:field="*{notes}">
                </td>
                <td>
                    <button type="submit" name="method" class="btn btn-red" value="resetAddingNewProduct">Удалить</button>
                </td>
            </tr>

            <tr th:if="${utils.shouldShowAddedItemsInTheBasket(productStep, productList, iterStat.last)}"
                th:each="productItem, iterStat : ${productList}">

                <td th:text="${productItem.productName.productName}"></td>
                <td th:text="${productItem.carModel}"></td>
                <td th:text="${productItem.engineModel}"></td>
                <td th:text="${productItem.oemArticleNumber}"></td>
                <td th:text="${productItem.crossArticleNumber}"></td>
                <td th:text="${productItem.brand.brandName}"></td>
                <td th:text="${productItem.notes}"></td>

                <td th:if="${utils.shouldShowCheckBox(productStep)}">
                    <input type="checkbox" name="selectedProductIds" class="styled-checkbox" th:value="${productItem.id}">
                </td>
                <td th:unless="${utils.shouldShowCheckBox(productStep)}">
                </td>
            </tr>
        </tbody>
    </table>

    <div class="button-container" style="display: block;">
        <button th:if="${productStep.value == 'PRODUCT_SELECTION_DONE'}"
                type="submit" name="method" class="btn btn-green" value="post">Добавить новый товар</button>

        <button th:unless="${productStep.value == 'PRODUCT_SELECTION_DONE'}"
                type="submit" name="method" class="btn btn-green" value="post">Сохранить</button>

        <button th:if="${productStep.value == 'PRODUCT_SELECTION_DONE'}"
                type="submit" name="method" class="btn btn-blue" value="saveAndClose">Завершить</button>

        <button th:unless="${productStep.value == 'PRODUCT_SELECTION_DONE'}"
                type="submit" name="method" class="btn btn-blue" value="saveAndClose">Сохранить и завершить</button>

        <button type="submit" name="method" value="deleteSelected" onclick="return confirm('Удалить выбранные товары?')"
                class="btn btn-red">Удалить выбранные товары</button>
    </div>
</form>

</body>
</html>

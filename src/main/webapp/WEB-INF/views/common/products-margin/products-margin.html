<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
    <title>Управление наценкой</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
        }
        .add-product-link {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .add-product-link:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            table-layout: fixed;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        th:first-child, td:first-child {
            width: 100px; /* Устанавливаем ширину для первого столбца */
            text-align: center;
        }
        th:nth-child(2), td:nth-child(2) {
            width: 60px; /* Устанавливаем ширину для второго столбца */
            text-align: center;
        }
        th:nth-child(10), td:nth-child(10) {
            width: 100px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }
        th input,
        th select {
            width: 100%;
            box-sizing: border-box;
        }
        th select {
            margin-bottom: 6px;
        }
        td:first-child, th:first-child {
            border-left: none;
        }
        td:last-child, th:last-child {
            border-right: none;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .error-message {
            color: red;
            margin-bottom: 20px;
        }
        a {
            text-decoration: none;
            color: #000000; /* Цвет текста ссылок */
            font-weight: normal;
            transition: color 0.3s ease, text-decoration 0.3s ease;
        }
        a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
        a:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(72, 168, 72, 0.6); /* Эффект при фокусе на ссылке */
        }
        input[type="checkbox"].styled-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #4CAF50;
            cursor: pointer;
        }
        .btn {
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-red {
            background-color: #f66f6f;
        }
        .btn-red:hover {
            background-color: #f44336;
        }
        .btn-pink {
            background-color: #f06292;
        }
        .btn-pink:hover {
            background-color: #ec407a;
        }
        .btn-green {
            background-color: #4CAF50;
        }
        .btn-green:hover {
            background-color: #45a049;
        }
        .btn-turquoise {
            background-color: #20c997;
        }
        .btn-turquoise:hover {
            background-color: #17b384;
        }
        thead tr:first-child th {
            position: sticky;
            top: 60px; /* высота шапки */
            z-index: 2;
        }
        thead tr:nth-child(2) th {
            position: sticky;
            top: 120.5px; /* шапка + первая строка */
            z-index: 2;
        }
    </style>
</head>
<body>

<div th:replace="fragments/common-header :: common-header"></div>

<form th:method="POST" th:action="@{${'/' + URIBeginning + '/product-management/products-margin'}}" th:object="${marginForm}">

    <div class="header">
        <h2>Наценки товаров</h2>

        <!-- Отображение сообщения об ошибке -->
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
            <div style="display: flex; gap: 10px;">
                <button type="submit" name="method" class="btn btn-green" value="saveAndClose">Закрыть с сохранением</button>
                <button type="submit" name="method" class="btn btn-turquoise" value="save">Обновить и сохранить</button>
                <button type="submit" name="method" class="btn btn-red" value="close"
                        onclick="return confirm('Вы уверены, что хотите закрыть без сохранения?')">Закрыть без сохранения</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" name="method" class="btn btn-green" value="applyFilter">Применить фильтр</button>
                <button type="submit" name="method" class="btn btn-pink" value="resetFilter">Сбросить фильтр</button>
            </div>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>EQUIVALENT GROUP ID</th>
            <th>ID товара</th>
            <th>Название товара</th>
            <th>Модель машины</th>
            <th>Модель мотора</th>
            <th>Артикул, OEM</th>
            <th>Артикул, КРОСС</th>
            <th>Бренд</th>
            <th>Наценка, %</th>
            <th>Комментарий</th>
        </tr>
        <tr>
            <th><input type="number" th:field="*{marginFilter.product.equivalentProductInfo.groupId}" style="width: 100%;"></th>

            <th><input type="number" th:field="*{marginFilter.product.id}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{marginFilter.product.productName.productName}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{marginFilter.product.carModel}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{marginFilter.product.engineModel}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{marginFilter.product.oemArticleNumber}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{marginFilter.product.crossArticleNumber}" style="width: 100%;"></th>

            <th><input type="text" th:field="*{marginFilter.product.brand.brandName}" style="width: 100%;"></th>

            <th>
                <select th:field="*{marginFilter.marginComparison}">
                    <option value="GREATER_THAN">Больше (>)</option>
                    <option value="GREATER_OR_EQUALS_THAN">Больше или равно (>=)</option>
                    <option value="LESS_THAN">Меньше (<)</option>
                    <option value="LESS_OR_EQUALS_THAN">Меньше или равно (<=)</option>
                    <option value="EQUALS">Равно (=)</option>
                    <option value="NOT_SET">Не установлено (null)</option>
                </select>
                <input type="number" step="0.01" min="0" max="99999.99" th:field="*{marginFilter.margin}" placeholder="Например, 12.55" style="width: 100%;">
            </th>

            <th><input type="text" th:field="*{marginFilter.product.notes}" style="width: 100%;"></th>
        </tr>
        </thead>
        <tbody>

        <tr>
            <td colspan="10"></td>
        </tr>

        <tr th:each="product : ${allProducts}"
            th:with="groupId=${product.getEquivalentProductInfo().getGroupId()}"
            th:style="${groupId != 0} ? 'background-color: ' + ${utils.getBackgroundColorByGroupId(groupId)} : ''">

            <td th:if="${groupId != 0}"><a th:text="${groupId}"></a></td>
            <td th:unless="${groupId != 0}"></td>

            <td><a th:text="${product.getId()}"></a></td>
            <td><a th:text="${product.getProductName().getProductName()}"></a></td>
            <td><a th:text="${product.getCarModel()}"></a></td>
            <td><a th:text="${product.getEngineModel()}"></a></td>
            <td><a th:text="${product.getOemArticleNumber()}"></a></td>
            <td><a th:text="${product.getCrossArticleNumber()}"></a></td>
            <td><a th:text="${product.getBrand().getBrandName()}"></a></td>

            <td><input type="number" step="0.01" min="0" max="99999.99" style="width: 100%;" th:field="*{marginMap[__${product.getId()}__]}"></td>

            <td><a th:title="${product.getNotes()}" th:text="${utils.getTruncatedText(product.getNotes(), 7)}"></a></td>
        </tr>
        </tbody>
    </table>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="ru", xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRM</title>
    <style>
        .block {
            width: 200px;
            height: 100px;
            border: 1px solid black;
            margin-right: 20px; /* добавлено, чтобы создать отступ между блоками */
            display: inline-block; /* изменено с flex на inline-block */
            vertical-align: center; /* выравнивание по вертикали */
            text-align: center; /* выравнивание текста по горизонтали */
            line-height: 60px; /* выравнивание текста по вертикали */
        }
    </style>
</head>

<body>

    <div class="block" id="sales">
        <a href="/prestige"><h2>Престиж</h2></a>
    </div>

    <div class="block" id="acquire">
        <h2>Склад</h2>
    </div>

</body>

</html>
